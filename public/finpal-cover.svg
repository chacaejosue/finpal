<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title description">
  <title id="title">FinPal — control de préstamos y dinero personal</title>
  <desc id="description">Portada de FinPal con el símbolo de una F, una moneda ascendente y una interfaz financiera sobre un fondo esmeralda degradado.</desc>

  <defs>
    <linearGradient id="background" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#075e4b"/>
      <stop offset="52%" stop-color="#149873"/>
      <stop offset="100%" stop-color="#5fe0b0"/>
    </linearGradient>
    <linearGradient id="mark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c7f9e6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#043b30" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1600" height="520" rx="30" fill="url(#background)"/>
  <circle cx="1320" cy="90" r="210" fill="#ffffff" fill-opacity=".07"/>
  <circle cx="1450" cy="430" r="280" fill="#043b30" fill-opacity=".09"/>

  <g transform="translate(166 104)" filter="url(#shadow)">
    <rect x="0" y="0" width="310" height="310" rx="76" fill="#075e4b" fill-opacity=".62"/>
    <path d="M76 48h132c12.2 0 22 9.8 22 22v28c0 12.2-9.8 22-22 22h-93v38h75c12.2 0 22 9.8 22 22v27c0 12.2-9.8 22-22 22h-75v61c0 12.2-9.8 22-22 22H76c-12.2 0-22-9.8-22-22V70c0-12.2 9.8-22 22-22Z" fill="url(#mark)"/>
    <circle cx="226" cy="236" r="47" fill="#5fe0b0"/>
    <circle cx="226" cy="236" r="35" fill="none" stroke="#075e4b" stroke-opacity=".36" stroke-width="5"/>
    <path d="M226 212v48M237 221c-4-5-9-7-15-7-8 0-13 5-13 12s5 10 17 13 17 7 17 15-7 13-16 13c-8 0-14-3-19-9" fill="none" stroke="#075e4b" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g fill="#ffffff" font-family="Arial, Helvetica, sans-serif">
    <text x="570" y="232" font-size="76" font-weight="700" letter-spacing="-2">FinPal</text>
    <text x="574" y="282" font-size="28" fill="#e8fff7">Préstamos claros. Dinero bajo control.</text>
  </g>

  <g transform="translate(1120 140)" fill="#ffffff" fill-opacity=".9">
    <rect width="300" height="190" rx="20" fill="#043b30" fill-opacity=".24"/>
    <rect x="26" y="28" width="112" height="10" rx="5" fill="#c7f9e6" fill-opacity=".8"/>
    <rect x="26" y="58" width="206" height="34" rx="10" fill="#ffffff" fill-opacity=".14"/>
    <rect x="26" y="112" width="112" height="44" rx="12" fill="#5fe0b0" fill-opacity=".85"/>
    <rect x="154" y="112" width="90" height="44" rx="12" fill="#ffffff" fill-opacity=".16"/>
  </g>
</svg>
